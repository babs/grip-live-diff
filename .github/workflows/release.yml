name: "Build and release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # A module path that does not resolve to this repo breaks `go install` and the
      # self-update, and nothing else in the pipeline would notice.
      - name: "Check the module path resolves to this repo"
        env:
          GOPROXY: direct
        run: go install "$(go list -m)@${GITHUB_REF_NAME}"
      - name: "Build"
        run: ./release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
