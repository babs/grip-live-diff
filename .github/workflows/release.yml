name: "Build and release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Same pinned toolchain as the Build workflow: the published binary must not be
      # compiled by whatever "stable" happens to mean on the day of the tag.
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # A module path that does not resolve to this repo breaks `go install` and the
      # self-update, and nothing else in the pipeline would notice.
      - name: "Check the module path resolves to this repo"
        env:
          GOPROXY: direct
        run: go install "$(go list -m)@${GITHUB_REF_NAME}"
      - name: "Build"
        run: ./release.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
