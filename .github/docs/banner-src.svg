<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#0d1117"/>
  <!-- logo: 256 box scaled 1.4 = 358px, centred on y=320 -->
  <g transform="translate(115 126) scale(1.4)">
    <rect x="40" y="24" width="176" height="208" rx="18" fill="#161b22" stroke="#e6edf3" stroke-width="10"/>
    <rect x="68" y="54" width="96" height="16" rx="8" fill="#e6edf3"/>
    <rect x="68" y="90" width="120" height="10" rx="5" fill="#3d444d"/>
    <rect x="68" y="112" width="44" height="10" rx="5" fill="#f85149"/>
    <line x1="66" y1="117" x2="114" y2="117" stroke="#ffb3b3" stroke-width="3" stroke-linecap="round"/>
    <rect x="122" y="112" width="66" height="10" rx="5" fill="#3fb950"/>
    <rect x="68" y="134" width="104" height="10" rx="5" fill="#3d444d"/>
    <rect x="62" y="152" width="76" height="18" rx="4" fill="#bf8700" opacity="0.3"/>
    <rect x="68" y="156" width="64" height="10" rx="5" fill="#3d444d"/>
    <line x1="66" y1="172" x2="134" y2="172" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>
    <rect x="144" y="156" width="36" height="10" rx="5" fill="#3d444d"/>
    <rect x="68" y="178" width="112" height="10" rx="5" fill="#3d444d"/>
    <rect x="68" y="200" width="72" height="10" rx="5" fill="#3d444d"/>
    <circle cx="212" cy="40" r="30" fill="#3fb950" opacity="0.25"/>
    <circle cx="212" cy="40" r="20" fill="#e6edf3"/>
    <circle cx="212" cy="40" r="13" fill="#3fb950"/>
  </g>
  <!-- text block, ~300px tall, centred on y=320 -->
  <g transform="translate(515 -15)">
    <text x="0" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" fill="#e6edf3">grip-live-diff</text>
    <text x="0" y="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e">Markdown preview, GitHub look.</text>
    <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e6edf3">
      <circle cx="12" cy="330" r="8" fill="#3fb950"/>
      <text x="36" y="340">Live reload, word-level diff</text>
      <circle cx="12" cy="382" r="8" fill="#d29922"/>
      <text x="36" y="392">Annotate what reads wrong</text>
      <circle cx="12" cy="434" r="8" fill="#58a6ff"/>
      <text x="36" y="444">Point your agent at it. It replies, you iterate.</text>
    </g>
  </g>
  <text x="640" y="584" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8b949e">go install github.com/babs/grip-live-diff@latest</text>
</svg>
