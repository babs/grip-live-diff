<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- document card, GitHub bounding-box look -->
  <rect x="40" y="24" width="176" height="208" rx="18" fill="#ffffff" stroke="#1f2328" stroke-width="10"/>
  <!-- heading -->
  <rect x="68" y="54" width="96" height="16" rx="8" fill="#1f2328"/>
  <!-- body lines, 22px pitch -->
  <rect x="68" y="90" width="120" height="10" rx="5" fill="#d0d7de"/>
  <!-- the diff line: removed (red) then added (green) -->
  <rect x="68" y="112" width="44" height="10" rx="5" fill="#ff8182"/>
  <line x1="66" y1="117" x2="114" y2="117" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/>
  <rect x="122" y="112" width="66" height="10" rx="5" fill="#2da44e"/>
  <rect x="68" y="134" width="104" height="10" rx="5" fill="#d0d7de"/>
  <!-- annotated passage: yellow tint, orange underline -->
  <rect x="62" y="152" width="76" height="18" rx="4" fill="#fff8c5"/>
  <rect x="68" y="156" width="64" height="10" rx="5" fill="#d0d7de"/>
  <line x1="66" y1="172" x2="134" y2="172" stroke="#bf8700" stroke-width="3" stroke-linecap="round"/>
  <rect x="144" y="156" width="36" height="10" rx="5" fill="#d0d7de"/>
  <rect x="68" y="178" width="112" height="10" rx="5" fill="#d0d7de"/>
  <rect x="68" y="200" width="72" height="10" rx="5" fill="#d0d7de"/>
  <!-- live pulse -->
  <circle cx="212" cy="40" r="30" fill="#2da44e" opacity="0.18"/>
  <circle cx="212" cy="40" r="20" fill="#1f2328"/>
  <circle cx="212" cy="40" r="13" fill="#2da44e"/>
</svg>
