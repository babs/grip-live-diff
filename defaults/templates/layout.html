<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
    <link
      id="theme-light"
      rel="stylesheet"
      href="/static/css/github-markdown-light.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      id="theme-dark"
      rel="stylesheet"
      href="/static/css/github-markdown-dark.css"
      media="(prefers-color-scheme: dark)"
    />
    <style id="highlight-light" media="(prefers-color-scheme: light)">{{ .CssCodeLight }}</style>
    <style id="highlight-dark" media="(prefers-color-scheme: dark)">{{ .CssCodeDark }}</style>
    <link rel="stylesheet" href="/static/css/github-print.css" media="print" />
    <link rel="stylesheet" href="/static/css/github-mermaid.css" />
    <link rel="stylesheet" href="/static/css/github-clipboard.css" />
    <link rel="stylesheet" href="/static/css/mathjax.css" />
    <link rel="stylesheet" href="/static/css/theme-switch.css" />
    <link rel="stylesheet" href="/static/css/github-diff.css" />
    <script src="/static/js/theme-switch.js"></script>
    <script src="/static/js/width-switch.js"></script>
    <script src="/static/js/scroll-keep.js"></script>
    <script src="/static/js/diff-switch.js"></script>
    <script src="/static/js/clipboard-copy.js"></script>
    <script src="/static/js/mathjax-options.js"></script>
    <script src="/static/js/tex-mml-chtml.js"></script>
    <script src="/static/js/mermaid.min.js"></script>
    <script src="/static/js/mermaid-init.js"></script>
    {{if .DiffMode}}<script src="/static/js/minimap.js"></script>{{end}}
  </head>

  <body class="markdown-body">
    <div class="toolbar">
      <div class="toolbar-row">
        <button id="width-toggle" class="theme-toggle" title="Toggle wide layout">
          <span class="theme-toggle-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 8h12M4.5 5.5 2 8l2.5 2.5M11.5 5.5 14 8l-2.5 2.5" />
            </svg>
          </span>
        </button>
        <a
          class="theme-toggle diff-toggle{{if .DiffMode}} diff-toggle-active{{else if .HasChanges}} diff-toggle-changed{{end}}"
          href="{{ .DiffHref }}"
          title="{{ .DiffTitle }}"
          aria-label="{{ .DiffTitle }}"
        >
          <span class="theme-toggle-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M8 1.5v7M4.5 5h7M3 12.5h10" />
            </svg>
          </span>
        </a>
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
          <span class="theme-toggle-icon"></span>
        </button>
      </div>
      {{if .DiffMode}}
      <div class="toolbar-row diff-status" data-diff-mode="{{ .DiffMode }}">
        <nav class="diff-refs" aria-label="Diff reference">
          <a class="diff-ref{{if eq .DiffMode "open"}} diff-ref-active{{end}}" {{if eq .DiffMode "open"}}aria-current="page"{{end}} href="{{ .Path }}?diff=open" title="Everything that changed since you opened the file (1)">since open</a>
          <a class="diff-ref{{if eq .DiffMode "last"}} diff-ref-active{{end}}" {{if eq .DiffMode "last"}}aria-current="page"{{end}} href="{{ .Path }}?diff=last" title="Only what the most recent save brought (2)">last edit</a>
          {{if .HasGit}}
          <a class="diff-ref{{if eq .DiffMode "head"}} diff-ref-active{{end}}" {{if eq .DiffMode "head"}}aria-current="page"{{end}} href="{{ .Path }}?diff=head" title="Everything not committed yet (3)">HEAD</a>
          {{else}}
          <span class="diff-ref diff-ref-disabled" title="Not a git work tree">HEAD</span>
          {{end}}
        </nav>
      </div>
      {{if .DiffLabel}}
      <div class="toolbar-row">
        <span class="diff-status-label">{{ .DiffLabel }}</span>
      </div>
      {{end}}
      <div class="toolbar-row">
        <form method="post" action="/__baseline" class="mark-read-form">
          <input type="hidden" name="path" value="{{ .Path }}" />
          <input type="hidden" name="diff" value="{{ .DiffMode }}" />
          <button type="submit" class="theme-toggle mark-read" {{if .MarkReadDisabled}}disabled{{end}} title="{{ .MarkReadTitle }}">
            <span class="theme-toggle-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 8.5l3.5 3.5 7-8" />
              </svg>
              Mark as read
            </span>
          </button>
        </form>
        <button id="minimap-toggle" class="theme-toggle minimap-toggle" title="Toggle minimap" aria-label="Toggle minimap" aria-pressed="true">
          <span class="theme-toggle-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="12" height="12" rx="1.5" />
              <path d="M10.5 2v12M4.5 5h3.5M4.5 8h3.5M4.5 11h3.5" />
            </svg>
          </span>
        </button>
      </div>
      {{end}}
    </div>
    <div class="container">
      <div {{if .BoundingBox }} class="container-inner" {{end}}>
        {{ .Content }}
      </div>
    </div>
  </body>
</html>
